<!doctype html>
<html lang="en">

    <!-- ── Favicon ──────────────────────────────────────────────────────── -->

    <title>Fahad Khalid | AI, Cloud &amp; Cybersecurity</title>

    <link rel="canonical" href="https://fahad-khalid-portfolio.vercel.app/" />

    <meta property="og:locale"      content="en_US" />
